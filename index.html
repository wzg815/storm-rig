<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0d10">
<title>风暴钻台 · 深蓝七号</title>
<style>
:root{--ink:#090b0e;--bone:#ece8de;--dim:rgba(236,232,222,.62);--faint:rgba(236,232,222,.22);--sig:#ffb347;--hot:#ffd08a;--alarm:#ff5a40;--ok:#5dffa0;--cy:#5fd6ff;
--f:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;--sh:0 0 2px rgba(0,0,0,.8),0 1px 6px rgba(0,0,0,.6);
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--bone);font-family:var(--f);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.hide{display:none!important}
/* boot */
#boot{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:60;transition:opacity .8s}
#boot.done{opacity:0;pointer-events:none}
.mark{font-weight:900;font-size:clamp(44px,9vw,104px);letter-spacing:.2em;margin-right:-.2em;line-height:1;text-shadow:0 0 40px rgba(255,179,71,.15)}
.sub{font-size:12px;letter-spacing:.32em;color:#8d9aa3}
.bar{width:min(340px,70vw);height:2px;background:#22282d}.bar i{display:block;height:100%;width:0;background:var(--sig);transition:width .3s}
/* menus */
.scr{position:fixed;inset:0;pointer-events:auto;display:flex;z-index:30}
#menu{background:linear-gradient(90deg,rgba(5,7,9,.88) 0%,rgba(5,7,9,.55) 38%,rgba(5,7,9,0) 70%);align-items:center;padding-left:max(6vw,calc(var(--sl) + 24px))}
.menu-in{max-width:520px}
.kicker{font-size:12px;letter-spacing:.35em;color:var(--sig);margin-bottom:10px}
.title{font-weight:900;font-size:clamp(46px,8vw,96px);letter-spacing:.12em;line-height:1.02;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.title small{display:block;font-size:.26em;letter-spacing:.42em;color:var(--dim);font-weight:500;margin-top:12px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:28px;width:min(320px,80vw)}
.btn{pointer-events:auto;appearance:none;border:1px solid var(--faint);background:rgba(10,13,16,.55);color:var(--bone);font:600 16px var(--f);letter-spacing:.16em;padding:14px 18px;text-align:left;cursor:pointer;position:relative;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,border-color .15s}
.btn:hover,.btn:active{background:rgba(255,179,71,.14);border-color:var(--sig)}
.btn.pri{background:var(--sig);color:#14100a;border-color:var(--sig);font-weight:800}
.btn.pri:hover{background:var(--hot)}
.btn .r{float:right;color:var(--dim);font-weight:500;letter-spacing:.06em}
.btn.pri .r{color:#3a2a10}
.note{margin-top:18px;font-size:12px;color:var(--dim);line-height:1.8;letter-spacing:.06em;max-width:440px}
#panel{background:rgba(5,7,9,.72);align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card{background:rgba(14,18,22,.94);border:1px solid var(--faint);padding:26px 28px;width:min(560px,92vw);max-height:90vh;overflow:auto}
.card h2{margin:0 0 6px;font-size:26px;letter-spacing:.14em}.card .k{font-size:11px;letter-spacing:.3em;color:var(--sig)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:15px}
.row input[type=range]{width:46%;accent-color:#ffb347}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{pointer-events:auto;border:1px solid var(--faint);background:transparent;color:var(--bone);font:600 13px var(--f);padding:8px 12px;cursor:pointer;letter-spacing:.08em}.seg button.on{background:var(--sig);color:#111;border-color:var(--sig)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;color:var(--dim);margin-top:12px}.keys b{color:var(--bone);font-weight:700}
.res-grade{font-size:110px;font-weight:900;line-height:1;color:var(--sig);text-shadow:0 0 50px rgba(255,179,71,.4)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:16px 0 8px}.stats div{border-left:2px solid var(--sig);padding-left:10px}.stats span{display:block;font-size:11px;color:var(--dim);letter-spacing:.2em}.stats b{font-size:22px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.obj{position:absolute;left:calc(var(--sl) + 22px);top:calc(var(--st) + 18px);max-width:340px;text-shadow:var(--sh)}
.obj .z{font-size:11px;letter-spacing:.3em;color:var(--sig)}.obj .t{font-size:17px;font-weight:700;margin-top:4px;letter-spacing:.06em}.obj .d{font-size:12px;color:var(--dim);margin-top:3px}
.obj .pips{display:flex;gap:6px;margin-top:8px}.obj .pips i{width:22px;height:4px;background:var(--faint)}.obj .pips i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#compass{position:absolute;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);width:min(440px,46vw);height:26px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
#compass .strip{position:absolute;top:0;height:100%;white-space:nowrap;font-size:12px;color:var(--dim)}
#compass .c{position:absolute;left:50%;top:0;width:2px;height:8px;background:var(--sig);transform:translateX(-1px)}
#compass .m{position:absolute;top:10px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);background:var(--sig);box-shadow:0 0 8px var(--sig)}
#radio{position:absolute;left:50%;top:calc(var(--st) + 52px);transform:translateX(-50%);text-align:center;max-width:min(680px,70vw);transition:opacity .4s;text-shadow:var(--sh)}
#radio .who{font-size:12px;letter-spacing:.24em;color:var(--sig);font-weight:700}#radio .who.alarm{color:var(--alarm)}
#radio .msg{margin-top:6px;font-size:16px;background:rgba(6,8,10,.55);padding:7px 14px;display:inline-block;line-height:1.5}
.vitals{position:absolute;left:calc(var(--sl) + 22px);bottom:calc(var(--sb) + 22px);width:260px;text-shadow:var(--sh)}
.hp{height:6px;background:rgba(255,255,255,.14);margin-top:6px;position:relative}.hp i{position:absolute;left:0;top:0;bottom:0;background:var(--bone);transition:width .15s}.hp i.low{background:var(--alarm)}
.lab{font-size:11px;letter-spacing:.24em;color:var(--dim);display:flex;justify-content:space-between}
.ammo{position:absolute;right:calc(var(--sr) + 26px);bottom:calc(var(--sb) + 22px);text-align:right;text-shadow:var(--sh)}
.ammo .n{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.ammo .n small{font-size:18px;color:var(--dim);font-weight:600;margin-left:6px}
.ammo .w{font-size:12px;letter-spacing:.2em;color:var(--sig);margin-top:4px}
.slots{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}.slots i{font-style:normal;font-size:11px;padding:3px 8px;border:1px solid var(--faint);color:var(--dim)}.slots i.on{border-color:var(--sig);color:var(--bone)}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}
#xh i{position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px #000}
#xh .a{width:2px;height:9px;left:-1px}#xh .b{width:9px;height:2px;top:-1px}
#xh .dot{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%}
#hitm{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hitm:before,#hitm:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}#hitm:before{left:14px;top:0;width:2px;height:30px;clip-path:polygon(0 0,100% 0,100% 33%,0 33%,0 67%,100% 67%,100% 100%,0 100%)}#hitm:after{top:14px;left:0;height:2px;width:30px;clip-path:polygon(0 0,33% 0,33% 100%,0 100%,0 0,67% 0,100% 0,100% 100%,67% 100%)}
#hitm.kill:before,#hitm.kill:after{background:var(--alarm)}
#dmgdir{position:absolute;left:50%;top:50%;width:0;height:0}
#dmgdir i{position:absolute;left:-60px;top:-150px;width:120px;height:26px;background:radial-gradient(ellipse at 50% 100%,rgba(255,60,30,.85),rgba(255,60,30,0) 70%);transform-origin:60px 150px;opacity:0;transition:opacity .5s}
#wp{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:var(--sig);text-shadow:var(--sh);font-weight:700;letter-spacing:.1em}
#wp:before{content:"";display:block;margin:0 auto 4px;width:12px;height:12px;border:2px solid var(--sig);transform:rotate(45deg);box-shadow:0 0 8px rgba(255,179,71,.7)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);text-align:center;text-shadow:var(--sh);font-size:15px;letter-spacing:.1em}
#prompt kbd{display:inline-block;border:1px solid var(--bone);padding:1px 8px;margin-right:8px;font:700 13px var(--f)}
#prog{width:220px;height:4px;background:rgba(255,255,255,.18);margin:8px auto 0}#prog i{display:block;height:100%;width:0;background:var(--ok)}
#bossbar{position:absolute;left:50%;top:calc(var(--st) + 92px);transform:translateX(-50%);width:min(520px,60vw);text-align:center;text-shadow:var(--sh)}
#bossbar .bn{font-size:13px;letter-spacing:.3em;color:var(--alarm);font-weight:800}#bossbar .bb{height:6px;background:rgba(255,255,255,.12);margin-top:6px}#bossbar .bb i{display:block;height:100%;background:linear-gradient(90deg,#ff5a40,#ffb347)}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(22px,3.4vw,40px);font-weight:900;letter-spacing:.24em;text-shadow:0 0 30px rgba(0,0,0,.8);opacity:0;transition:opacity .5s;text-align:center}
#toast small{display:block;font-size:.4em;letter-spacing:.3em;color:var(--sig);margin-top:8px}
#fps{position:absolute;right:calc(var(--sr) + 70px);top:calc(var(--st) + 14px);font-size:11px;color:var(--dim)}
#portrait{position:fixed;inset:0;background:var(--ink);z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:18px;letter-spacing:.12em;text-align:center;padding:30px}
#portrait .ph{width:46px;height:78px;border:3px solid var(--bone);border-radius:9px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* touch */
#touch{position:fixed;inset:0;z-index:20;pointer-events:none}
#touch.on{pointer-events:auto}
.tb{position:absolute;border-radius:50%;border:1.5px solid rgba(236,232,222,.42);background:rgba(10,13,16,.32);display:flex;align-items:center;justify-content:center;color:var(--bone);font:700 13px var(--f);letter-spacing:.04em;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-shadow:var(--sh)}
.tb.dn{background:rgba(255,179,71,.35);border-color:var(--sig)}
#joyB{position:absolute;width:150px;height:150px;left:calc(var(--sl) + 44px);bottom:calc(var(--sb) + 26px);border-radius:50%;border:1.5px solid rgba(236,232,222,.3);background:radial-gradient(circle,rgba(10,13,16,.1),rgba(10,13,16,.38))}
#joyK{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(236,232,222,.55);box-shadow:0 2px 10px rgba(0,0,0,.4)}
#joyB.sprint{border-color:var(--sig)}#joyB .sp{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:11px;color:var(--sig);letter-spacing:.2em;opacity:0}#joyB.sprint .sp{opacity:1}
#tFire{width:92px;height:92px;font-size:15px}
#tFire:before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,179,71,.7)}
#tFireL{width:58px;height:58px}
.sm{width:54px;height:54px;font-size:12px}
#tAct{width:84px;height:84px;border-color:var(--ok);color:var(--ok);font-size:13px;flex-direction:column;line-height:1.3}
#tAct svg{position:absolute;inset:-4px;width:92px;height:92px;transform:rotate(-90deg)}
#tPause{position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 10px);width:40px;height:40px;border-radius:6px;font-size:16px}
body.mob .vitals{left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 10px);width:200px;text-align:center}
body.mob .ammo{right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 34px);text-align:center;pointer-events:auto}
body.mob .ammo .n{font-size:26px}body.mob .ammo .n small{font-size:13px}body.mob .ammo .w{display:none}body.mob .slots{justify-content:center;margin-top:3px}
body.mob .obj{max-width:240px;top:calc(var(--st) + 10px)}body.mob .obj .t{font-size:14px}body.mob .obj .d{display:none}
body.mob #compass{top:calc(var(--st) + 8px);width:min(300px,38vw)}body.mob #radio{top:calc(var(--st) + 40px)}body.mob #radio .msg{font-size:13px}
body.mob #bossbar{top:calc(var(--st) + 80px)}body.mob #prompt{display:none}body.mob #fps{right:calc(var(--sr) + 64px)}
body.mob #menu{padding-left:calc(var(--sl) + 28px)}body.mob .title{font-size:52px}body.mob .btns{margin-top:16px;gap:8px}body.mob .btn{padding:11px 16px;font-size:15px}body.mob .note{display:none}body.mob .kicker{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="portrait"><div class="ph"></div><div>请把手机横过来游玩</div><div style="font-size:13px;color:var(--dim)">建议关闭屏幕方向锁定</div></div>

  <div class="obj"><div class="z" id="oZone">A区 · 货运甲板</div><div class="t" id="oT">—</div><div class="d" id="oD"></div><div class="pips"><i></i><i></i><i></i></div></div>
  <div id="compass"><div class="strip" id="cStrip"></div><div class="c"></div><div class="m" id="cMark"></div></div>

  <div id="wp" class="hide"><span id="wpT"></span></div>
  <div id="xh"><i class="a" id="xU"></i><i class="a" id="xD"></i><i class="b" id="xL"></i><i class="b" id="xR"></i><i class="dot"></i></div>
  <div id="hitm"></div>

  <div id="toast"></div>
  <div id="fps"></div>
</div>
<div id="touch">
  <div id="joyB"><div class="sp">冲刺</div><div id="joyK"></div></div>
  <div class="tb" id="tFireL">开火</div>
  <div class="tb" id="tFire">开火</div>
  <div class="tb sm" id="tAds">开镜</div>
  <div class="tb sm" id="tReload">换弹</div>
  <div class="tb sm" id="tJump">跳跃</div>
  <div class="tb sm" id="tSwap">切枪</div>
  <div class="tb hide" id="tAct"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="43" fill="none" stroke="rgba(93,255,160,.25)" stroke-width="4"/><circle id="tActRing" cx="46" cy="46" r="43" fill="none" stroke="#5dffa0" stroke-width="4" stroke-dasharray="270" stroke-dashoffset="270"/></svg><span>按住</span><span>骇入</span></div>
  <div class="tb" id="tPause">Ⅱ</div>
</div>
<div id="menu" class="scr hide"><div class="menu-in">
  <div class="kicker">深蓝七号 · 海上研究平台 · 风暴之夜</div>
  <div class="title">风暴钻台<small>STORM RIG · 单人突击行动</small></div>
  <div class="btns">
    <button class="btn pri" data-a="start">开始行动<span class="r">▶</span></button>
    <button class="btn" data-a="diff">难度<span class="r" id="mDiff">普通</span></button>
    <button class="btn" data-a="settings">设置<span class="r" id="mQ">画质</span></button>
    <button class="btn" data-a="help">任务简报与操作</button>
  </div>
  <div class="note" id="mBest">平台AI「潮汐」失控，机器人接管了钻台。关闭三座信号干扰塔，击毁守卫机甲「铁鲸」，搭乘直升机撤离。</div>
</div></div>
